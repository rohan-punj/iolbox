# /etc/wsl.conf — installed into the rootfs by build-rootfs.sh so it's
# present in BOTH packaged artifacts (the file is harmless/inert on the
# VMware appliance; WSL2 just won't read it there since there's no wslhost).
#
# Kept intentionally minimal — this runtime has exactly one job (host the
# supervisor + IOL/VPCS), so we turn off the WSL conveniences that exist for
# general-purpose dev distros and would otherwise add noise or attack
# surface for no benefit here.

[boot]
# Required so the systemd units in files/*.service actually run. Without
# this, WSL2 runs init as a lightweight WSL-specific shim and the
# iolbox-supervisor.service / iolbox-firstboot-iourc.service units defined in
# this directory are never started — the runtime would come up with no
# supervisor listening on 4000, which looks like a provider-level failure
# to the Windows GUI.
systemd=true

[automount]
# No need to see Windows drives from inside this single-purpose runtime;
# the image library is synced in explicitly by the provider (see
# docs/providers.md "Image sync"), not browsed from a mounted C:\.
enabled=false

[network]
# CRITICAL: pin the hostname. WSL2's default is the Windows host's
# hostname, which would (a) break the firstboot-generated iourc — IOL
# checks the license against the RUNNING hostname, and the iourc line says
# "iolbox = <key>" — and (b) leave the hostname unresolvable via /etc/hosts,
# which makes every `sudo` invocation stall ~10s on DNS (the extnet verbs
# run `sudo -n ip/iptables/...` and would each eat that stall; see the
# cmdTimeout note in supervisor/internal/extnet/endpoint_linux.go).
hostname=iolbox
# Keep WSL from regenerating /etc/hosts (which carries the load-bearing
# "127.0.1.1 iolbox" line — see above) and /etc/resolv.conf. The supervisor
# itself does no outbound DNS; the NAT node hands lab nodes public DNS
# (1.1.1.1/8.8.8.8) directly in its DHCP leases.
generateResolvConf=false
generateHosts=false

[interop]
# No need to exec Windows binaries from inside the runtime, and appendWindowsPath
# would otherwise pollute PATH with Windows-side entries that are meaningless here.
enabled=false
appendWindowsPath=false
