# sysctl drop-in, installed to /etc/sysctl.d/99-iolab.conf inside the
# rootfs. Belt-and-suspenders alongside the no-default-route networkd
# config in 01-no-default-route.network — even if something in the network
# stack ever adds a route, these settings keep the runtime from usefully
# routing/forwarding traffic anywhere it shouldn't.
#
# NOTE: IOL's own inter-node links are UDP tunnels handled entirely in
# userspace by iol_wrapper/the supervisor's relay (see docs/protocol.md
# "Interface addressing (IOL)") — they never touch the kernel's IP
# forwarding path, so disabling forwarding here has zero effect on lab
# connectivity between nodes. It only prevents this runtime from ever
# acting as an accidental router for anything else on the host-only
# network segment.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Belt-and-suspenders for the "no default route" posture: even if a route
# somehow gets added, don't accept ICMP redirects that could otherwise be
# used to steer traffic through this host.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# This runtime is single-tenant, disposable, and localhost-only by design
# (PLAN.md: "no login, single-user, localhost-only"). No sysctl hardening
# beyond the above is attempted — anything more elaborate (e.g. full
# nftables default-deny) is out of scope for a throwaway lab VM and would
# only add another thing that can silently break IOL's UDP tunnels.
