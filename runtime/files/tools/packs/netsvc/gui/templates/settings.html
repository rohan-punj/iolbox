{{define "content"}}
<h1>Network Services settings</h1>
<form method="post" action="/settings/save"><label>Service address / DHCP server ID<input name="server_ip" value="{{.Config.DHCP.ServerIP}}" placeholder="blank = eth1 IPv4"></label><div class="grid"><label>DHCP pool subnet<input name="pool_subnet" value="{{with index .Config.DHCP.Pools 0}}{{.Subnet}}{{end}}"></label><label>Range start<input name="pool_start" value="{{with index .Config.DHCP.Pools 0}}{{.RangeStart}}{{end}}"></label><label>Range end<input name="pool_end" value="{{with index .Config.DHCP.Pools 0}}{{.RangeEnd}}{{end}}"></label><label>Router<input name="pool_router" value="{{with index .Config.DHCP.Pools 0}}{{.Router}}{{end}}"></label></div><label>DHCP DNS servers (comma separated)<input name="dns_servers" value="{{range $i,$v := .Config.DHCP.DNSServers}}{{if $i}}, {{end}}{{$v}}{{end}}"></label><label>DHCP NTP servers<input name="ntp_servers" value="{{range $i,$v := .Config.DHCP.NTPServers}}{{if $i}}, {{end}}{{$v}}{{end}}"></label><label>DHCP option 66 TFTP name<input name="tftp_name" value="{{.Config.DHCP.TFTPName}}"></label><label>DHCP option 150 TFTP addresses<input name="tftp_addresses" value="{{range $i,$v := .Config.DHCP.TFTPAddresses}}{{if $i}}, {{end}}{{$v}}{{end}}"></label><label>Authoritative DNS zone<input name="zone" value="{{.Config.DNS.Zone}}"></label><label>DNS records JSON (A, AAAA, CNAME, PTR, NS)<textarea name="records_json" rows="8">{{.Records}}</textarea></label><div class="grid"><label>NTP stratum<input name="ntp_stratum" value="{{.Config.NTP.Stratum}}"></label><label>NTP reference IPv4<input name="ntp_server_ip" value="{{.Config.NTP.ServerIP}}"></label></div><h3>UDP bind ports</h3><div class="grid"><label>DNS<input name="dns_port" value="{{.Config.Ports.DNS}}"></label><label>DHCP<input name="dhcp_port" value="{{.Config.Ports.DHCP}}"></label><label>NTP<input name="ntp_port" value="{{.Config.Ports.NTP}}"></label><label>TFTP<input name="tftp_port" value="{{.Config.Ports.TFTP}}"></label></div><button type="submit">Save and rebind</button></form>
<p class="muted">Leases, zones entered at runtime, and transfer logs are in-memory service state. Restarting the node clears them. TFTP uploads are sandboxed under the pack's writable directory.</p>
{{end}}
