{{define "content"}}<h1>Settings</h1>{{if .Warning}}<article class="warning">{{.Warning}}</article>{{end}}<form method="post" action="/settings/save"><label>Listen port<input type="number" name="port" value="{{.Config.ListenPort}}" min="0" max="65535"><small>Use 8080 or another unprivileged port. Port 80 requires the privileged-port supervisor follow-up.</small></label><label>index.html<textarea name="index_html" rows="12">{{.Config.IndexHTML}}</textarea></label><button type="submit">Save and restart</button></form>{{end}}
