{{define "content"}}<h1>Settings</h1>{{if .Warning}}<article class="warning">{{.Warning}}</article>{{end}}<form method="post" action="/settings/save"><label>Listen port<input type="number" name="port" value="{{.Config.ListenPort}}" min="0" max="65535"><small>Any port 1-65535 works — this appliance's per-node network namespace already allows unprivileged processes to bind privileged ports.</small></label><label>index.html<textarea name="index_html" rows="12">{{.Config.IndexHTML}}</textarea></label><button type="submit">Save and restart</button></form>{{end}}
