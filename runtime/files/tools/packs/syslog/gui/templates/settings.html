{{define "content"}}<h1>Settings</h1>{{if .Warning}}<article class="warning">{{.Warning}}</article>{{end}}<form method="post" action="/settings/save"><label>Listen port<input type="number" name="port" value="{{.Config.ListenPort}}" min="0" max="65535"><small>Default: UDP 514. Port 0 asks the OS for an ephemeral test port.</small></label><label>Maximum entries<input type="number" name="max_entries" value="{{.Config.MaxEntries}}" min="1"><small>Resizing keeps the newest entries that fit.</small></label><button type="submit">Save and restart</button></form>{{end}}
