{{define "page-login"}}
{{template "head" .}}
<main class="container" style="max-width:24rem;margin-top:5rem;">
  <hgroup>
    <h2>🛡️ Security Bench</h2>
    <p class="muted">L2/L3 security learning tools for Cisco IOS lab topologies</p>
  </hgroup>
  {{if .FlashErr}}<p class="bad">{{.Flash}}</p>{{end}}
  <form method="post" action="/login">
    <input name="user" placeholder="Username" autocomplete="username" autofocus required>
    <input name="pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <small class="muted">Default <code>admin</code> / <code>pnet</code> — change it in Settings.</small>
</main>
</body>
</html>
{{end}}
