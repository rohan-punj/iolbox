{{define "content"}}{{template "attempts" .}}{{end}}
{{define "attempts"}}<table><thead><tr><th>Time</th><th>Protocol</th><th>User</th><th>Remote</th><th>Result</th><th>Message</th></tr></thead><tbody>{{range .}}<tr><td>{{.At.Format "15:04:05"}}</td><td>{{.Proto}}</td><td>{{.User}}</td><td>{{.Remote}}</td><td class="{{.Result}}">{{.Result}}</td><td>{{.Message}}</td></tr>{{else}}<tr><td colspan="6">No attempts yet.</td></tr>{{end}}</tbody></table>{{end}}
