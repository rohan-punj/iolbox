{{define "content"}}
<h1>Settings</h1><form method="post" action="/settings/save"><label>Protocol<select name="protocol"><option value="radius" {{if eq .Protocol "radius"}}selected{{end}}>RADIUS</option><option value="tacacs" {{if eq .Protocol "tacacs"}}selected{{end}}>TACACS+ (requires privileged-port enablement)</option></select></label><label>Shared secret<input type="password" name="shared_secret" value="{{.SharedSecret}}" required></label><button type="submit">Save settings</button></form><p class="muted">MVP serves RADIUS on UDP 1812. TACACS+ is reserved for the privileged-port supervisor follow-up.</p>
<h2>Users</h2><table><thead><tr><th>Username</th><th>Service</th><th>Privilege</th><th></th></tr></thead><tbody>{{range $i, $u := .Users}}<tr><td>{{$u.Username}}</td><td>{{$u.Service}}</td><td>{{$u.PrivLvl}}</td><td><form method="post" action="/users/delete"><input type="hidden" name="index" value="{{$i}}"><button type="submit" class="secondary">Delete</button></form></td></tr>{{else}}<tr><td colspan="4">No users configured.</td></tr>{{end}}</tbody></table>
<h2>Add user</h2><form method="post" action="/users/add"><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><label>Service<input name="service" value="login"></label><label>Privilege level<input type="number" name="priv_lvl" value="1" min="0" max="15"></label><button type="submit">Add user</button></form>
{{end}}
