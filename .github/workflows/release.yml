name: Release

# Triggers: a version tag builds+drafts a release; workflow_dispatch lets a
# maintainer dry-run the whole pipeline (build/test artifacts, no publish)
# without cutting a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Windows: the ACTUAL shipped Windows deliverable is tools/iolab-launcher,
  # a plain Go exe (browser-first GUI — the Tauri/Rust shell under app/
  # src-tauri was abandoned when the project pivoted browser-first and is
  # not known to still build). Do not resurrect the Tauri bundle here.
  # ---------------------------------------------------------------------
  build-windows:
    name: Build Windows launcher + capture-helper
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 so `git describe --tags` (used by build-release.sh
      # in the Linux job, and good practice here too for parity) sees real
      # tag history instead of the shallow single commit `checkout` gives
      # by default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet + test iolab-launcher
        working-directory: tools/iolab-launcher
        run: |
          go vet ./...
          go test ./...

      - name: Build iolbox-launcher.exe
        working-directory: tools/iolab-launcher
        run: go build -o iolbox-launcher.exe .

      - name: Vet + test capture-helper
        working-directory: tools/capture-helper
        run: |
          go vet ./...
          go test ./...

      - name: Build capture-helper.exe
        working-directory: tools/capture-helper
        run: go build -o capture-helper.exe .

      # NOTE: both exes are UNSIGNED. A code-signing step (e.g. Azure Trusted
      # Signing, or a self-hosted signtool + cert) slots in here later,
      # between the build steps above and this upload. Until then, Windows
      # SmartScreen will warn on first run — expected, not a CI bug.
      #
      # NOTE: this job does NOT assemble the full launcher bundle (the
      # qemu/ subdirectory and iolbox-disk.qcow2 that tools/iolab-launcher
      # expects alongside it — see runtime/pack-qemu.sh and docs/INSTALL.md
      # "QEMU disk (Windows launcher)"). Neither qemu's third-party binaries
      # nor the multi-GB qcow2 disk live in this repo, so that bundle is
      # assembled by hand on the private builder and attached to the draft
      # release alongside this job's two exes.
      - uses: actions/upload-artifact@v4
        with:
          name: iolbox-windows
          path: |
            tools/iolab-launcher/iolbox-launcher.exe
            tools/capture-helper/capture-helper.exe

  # ---------------------------------------------------------------------
  # Linux: builds the GUI-embedded supervisor the ONLY correct way, then
  # bakes every Linux-hostable packaging target that doesn't need loop
  # devices/chroot/grub (those three — vmdk/vmx, OVA, qcow2 — need a
  # root-capable builder and are attached to the release by hand; see the
  # release job's draft body).
  # ---------------------------------------------------------------------
  build-linux:
    name: Build supervisor + Linux packaging targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-release.sh stamps the binary's version via
          # `git describe --tags`; a shallow checkout has no tag history,
          # so the stamp silently degrades to a bare commit hash instead of
          # e.g. "v0.4.0". fetch-depth 0 keeps that stamp meaningful.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # THE ONLY correct way to produce a deployable supervisor binary.
      # build-release.sh runs `npm run build:embed` before compiling and
      # then asserts the embedded index.html isn't the committed
      # placeholder. A bare `go build ./cmd/supervisor` skips build:embed
      # entirely and ships that placeholder ("GUI not bundled in this
      # build") straight into a release artifact — which is exactly what
      # the previous version of this workflow did. Never shortcut this.
      # Both architectures are built by ONE invocation on purpose. The script
      # runs `npm run build:embed` once and restores the committed placeholder
      # when it exits, so any compile placed after it in this job would embed
      # the placeholder instead of the real GUI. One invocation, one embed,
      # two binaries that provably carry the same bundle.
      - name: Build supervisors (build-release.sh — GUI embedded, amd64 + arm64)
        run: bash build-release.sh --arch amd64,arm64

      # gcc-aarch64-linux-gnu is needed only for the arm64 VPCS build below:
      # VPCS is C, so unlike every Go component it cannot be cross-compiled by
      # the toolchain we already have.
      - name: Install rootfs/packaging build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap zstd build-essential gcc-aarch64-linux-gnu

      # fetch-vpcs.sh needs git + make + a C compiler (all covered by
      # build-essential + the runner's preinstalled git) to clone and
      # statically link the GNS3/vpcs fork; it caches its output at
      # runtime/build/vpcs/vpcs and no-ops on a second run if that binary
      # already exists. build-rootfs.sh does NOT call it automatically —
      # it hard-fails if the vpcs binary is missing — so it must run here
      # as an explicit step before build-rootfs.sh.
      - name: Fetch/build VPCS
        run: runtime/fetch-vpcs.sh

      # build-rootfs.sh must run as root (debootstrap needs to mknod/chroot).
      # Its defaults already match this job's layout: --supervisor-bin
      # defaults to supervisor/bin/supervisor-linux-amd64 (build-release.sh's
      # output) and --build-dir defaults to runtime/build (fetch-vpcs.sh's
      # cache location), so no flags are needed here.
      - name: Bake shared rootfs
        run: sudo runtime/build-rootfs.sh

      # pack-wsl.sh doesn't strictly need root (plain tar of an existing
      # dir) but debootstrap can leave a few root-only files behind, so run
      # it as root too, per its own header comment.
      - name: Pack WSL rootfs tarball
        run: sudo runtime/pack-wsl.sh --build-dir runtime/build

      # workflow_dispatch runs (no tag) have no meaningful semver — fall
      # back to the branch/ref name, which pack-lxc.sh only uses as an
      # opaque label in the output filename (iolbox-ct-<VERSION>.tar.zst).
      - name: Resolve version string
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Pack Proxmox LXC template
        run: sudo runtime/pack-lxc.sh --build-dir runtime/build --version "${{ steps.version.outputs.value }}"

      # pack-native.sh does NOT consume the debootstrap rootfs at all — per
      # its own header, a native install runs on the operator's own distro,
      # so it only needs the supervisor + vpcs binaries plus files under
      # runtime/files/{,native/}. It could run before build-rootfs.sh, but
      # is kept after here so every packaging step reads top-to-bottom in
      # one pass; it needs no root (no loop devices/chroot involved).
      - name: Pack native (systemd) server tarball
        run: runtime/pack-native.sh --supervisor-bin supervisor/bin/supervisor-linux-amd64 --build-dir runtime/build --version "${{ steps.version.outputs.value }}"

      # --- linux/arm64 payload, for the macOS native-arm64 profile only ------
      #
      # IOLBOX_BUILD_DIR must differ from the amd64 build dir: fetch-vpcs.sh
      # writes $BUILD_DIR/vpcs/vpcs for BOTH architectures and short-circuits
      # if that file already exists, so reusing runtime/build would silently
      # skip this build and leave the amd64 binary in place.
      - name: Build VPCS for linux/arm64
        env:
          IOLBOX_BUILD_DIR: runtime/build-arm64
          VPCS_CC: aarch64-linux-gnu-gcc
        run: runtime/fetch-vpcs.sh --arch arm64

      # --out runtime/build so the tarball lands beside the amd64 one for the
      # shared checksum manifest; --build-dir keeps its vpcs/toollaunch/pack
      # staging separate. pack-native.sh cross-compiles toollaunch and every
      # tool pack for the target arch itself and hard-fails on a wrong ELF.
      - name: Pack native (systemd) server tarball — linux/arm64
        run: |
          runtime/pack-native.sh --arch arm64 \
            --bundle-guest-qemu \
            --supervisor-bin supervisor/bin/supervisor-linux-arm64 \
            --build-dir runtime/build-arm64 \
            --out runtime/build \
            --version "${{ steps.version.outputs.value }}"

      # Two manifests on purpose. SHA256SUMS-ci.txt is itself a PUBLISHED
      # release asset, so it must list exactly the files that are published —
      # if it named the macOS-only arm64 payload, `sha256sum -c SHA256SUMS-ci.txt`
      # against the downloaded release assets would fail on a missing file.
      # The arm64 payload gets its own manifest, travelling with it in the
      # CI-only artifact that build-macos consumes.
      - name: Generate checksums
        working-directory: runtime/build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sha256sum iolbox-rootfs.tar iolbox-ct-*.tar.zst "iolbox-server-${VERSION}.tar.gz" > SHA256SUMS-ci.txt
          cat SHA256SUMS-ci.txt
          sha256sum "iolbox-server-${VERSION}-linux-arm64.tar.gz" > SHA256SUMS-macos-arm64.txt
          cat SHA256SUMS-macos-arm64.txt

      # PUBLISHED Linux artifacts. The paths are listed EXPLICITLY rather than
      # globbed: the release job publishes iolbox-linux/**/* wholesale, so a
      # wildcard here would silently turn the macOS-only arm64 payload into a
      # public standalone Linux release asset — an extra shipped target with
      # its own support expectations that nobody asked for. If a standalone
      # linux/arm64 server target is ever wanted, that is a deliberate product
      # decision with its own docs and install guide, not a side effect.
      - uses: actions/upload-artifact@v4
        with:
          name: iolbox-linux
          path: |
            runtime/build/iolbox-rootfs.tar
            runtime/build/iolbox-ct-*.tar.zst
            runtime/build/iolbox-server-${{ steps.version.outputs.value }}.tar.gz
            runtime/build/SHA256SUMS-ci.txt

      # CI-ONLY artifact: consumed by build-macos, never published. It carries
      # the checksum manifest too so build-macos can authenticate the payload
      # the same way it authenticates the amd64 one.
      - uses: actions/upload-artifact@v4
        with:
          name: iolbox-macos-payload-arm64
          path: |
            runtime/build/iolbox-server-${{ steps.version.outputs.value }}-linux-arm64.tar.gz
            runtime/build/SHA256SUMS-macos-arm64.txt

  # ---------------------------------------------------------------------
  # macOS: package the Darwin launcher with the exact payloads from
  # build-linux above — the untagged amd64 one for the Rosetta profiles and
  # the linux/arm64 one for the native-arm64 profile. This job never rebuilds
  # a payload and never discovers one by searching; both are named exactly and
  # verified against build-linux's checksum manifest before packing.
  # ---------------------------------------------------------------------
  build-macos:
    name: Build Apple Silicon macOS archive
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/iolab-launcher/go.mod

      - uses: actions/download-artifact@v4
        with:
          name: iolbox-linux
          path: linux-artifact

      - uses: actions/download-artifact@v4
        with:
          name: iolbox-macos-payload-arm64
          path: linux-artifact-arm64

      - name: Resolve release/ref version and source date
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          test -n "$version"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$epoch" >> "$GITHUB_OUTPUT"

      # Both payloads go through the SAME authentication: exactly one file of
      # the expected name, exactly one well-formed checksum manifest, exactly
      # one line in it for that basename, and a real sha256sum -c. The logic
      # is a shell function invoked twice rather than copied, so the two
      # cannot drift apart — this is the security-relevant step of the job.
      - name: Select and verify exact build-linux payloads
        id: payload
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          select_and_verify() {
            local label="$1" root="$2" want="$3" manifest="$4"
            local payload base checksums expected
            mapfile -t payloads < <(find "$root" -type f -name "$want" -print)
            test "${#payloads[@]}" -eq 1
            payload="${payloads[0]}"
            base="$(basename "$payload")"
            mapfile -t checksum_files < <(find "$root" -type f -name "$manifest" -print)
            test "${#checksum_files[@]}" -eq 1
            checksums="${checksum_files[0]}"
            expected="$(awk -v b="$base" '
              BEGIN { bad=0; matches=0; digest="" }
              NF != 2 || length($1) != 64 || $1 !~ /^[0-9A-Fa-f]+$/ || $2 !~ /^\*?[^[:space:]]+$/ { bad=1 }
              $2 == b || $2 == "*" b { matches++; digest=$1 }
              END {
                if (bad || matches != 1) exit 1
                print digest
              }
            ' "$checksums")" || {
              echo "checksum manifest is malformed or does not contain exactly one line for $base" >&2
              exit 1
            }
            printf '%s' "$expected" | grep -Eq '^[0-9A-Fa-f]{64}$'
            ( cd "$(dirname "$payload")" && printf '%s  %s\n' "$expected" "$base" | sha256sum -c - )
            echo "${label}path=$payload" >> "$GITHUB_OUTPUT"
            echo "${label}basename=$base" >> "$GITHUB_OUTPUT"
            echo "${label}sha256=$expected" >> "$GITHUB_OUTPUT"
            echo "build-linux payload ($label): $payload"
            echo "trusted payload sha256 ($label): $expected"
          }

          select_and_verify "" linux-artifact "iolbox-server-${VERSION}.tar.gz" SHA256SUMS-ci.txt
          select_and_verify "arm64-" linux-artifact-arm64 "iolbox-server-${VERSION}-linux-arm64.tar.gz" SHA256SUMS-macos-arm64.txt

      - name: Vet and test launcher
        working-directory: tools/iolab-launcher
        run: |
          go vet ./...
          go test ./...

      - name: Cross-build Darwin arm64 launcher
        working-directory: tools/iolab-launcher
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o bin/iolbox-darwin-arm64 .

      - name: Vet and test IOLbox.app stub
        working-directory: tools/iolbox-app-stub
        run: |
          go vet ./...
          go test ./...

      - name: Cross-build Darwin arm64 IOLbox.app stub
        working-directory: tools/iolbox-app-stub
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o bin/iolbox-app-stub-darwin-arm64 .

      - name: Pack deterministic macOS archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source-date-epoch }}
          PAYLOAD: ${{ steps.payload.outputs.path }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.sha256 }}
          PAYLOAD_ARM64: ${{ steps.payload.outputs.arm64-path }}
          PAYLOAD_ARM64_SHA256: ${{ steps.payload.outputs.arm64-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/pack-release.sh \
            --launcher "$GITHUB_WORKSPACE/tools/iolab-launcher/bin/iolbox-darwin-arm64" \
            --app-stub "$GITHUB_WORKSPACE/tools/iolbox-app-stub/bin/iolbox-app-stub-darwin-arm64" \
            --payload "$GITHUB_WORKSPACE/$PAYLOAD" \
            --payload-sha256 "$PAYLOAD_SHA256" \
            --payload-arm64 "$GITHUB_WORKSPACE/$PAYLOAD_ARM64" \
            --payload-arm64-sha256 "$PAYLOAD_ARM64_SHA256" \
            --version "$VERSION" \
            --output "$GITHUB_WORKSPACE/iolbox-macos-arm64.tar.gz" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Verify archive layout and reproducibility
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source-date-epoch }}
          PAYLOAD: ${{ steps.payload.outputs.path }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.sha256 }}
          PAYLOAD_ARM64: ${{ steps.payload.outputs.arm64-path }}
          PAYLOAD_ARM64_SHA256: ${{ steps.payload.outputs.arm64-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/tests/release-layout-test.sh \
            --archive "$GITHUB_WORKSPACE/iolbox-macos-arm64.tar.gz" \
            --launcher "$GITHUB_WORKSPACE/tools/iolab-launcher/bin/iolbox-darwin-arm64" \
            --app-stub "$GITHUB_WORKSPACE/tools/iolbox-app-stub/bin/iolbox-app-stub-darwin-arm64" \
            --payload "$GITHUB_WORKSPACE/$PAYLOAD" \
            --payload-sha256 "$PAYLOAD_SHA256" \
            --payload-arm64 "$GITHUB_WORKSPACE/$PAYLOAD_ARM64" \
            --payload-arm64-sha256 "$PAYLOAD_ARM64_SHA256" \
            --version "$VERSION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          echo "--- tar listing ---"
          tar -tzf "$GITHUB_WORKSPACE/iolbox-macos-arm64.tar.gz"
          echo "--- internal checksums ---"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$GITHUB_WORKSPACE/iolbox-macos-arm64.tar.gz" -C "$work"
          ( cd "$work/iolbox-macos-arm64" && sha256sum -c SHA256SUMS )
          echo "--- launcher file ---"
          file "$work/iolbox-macos-arm64/iolbox"
          echo "--- IOLbox.app stub file ---"
          file "$work/iolbox-macos-arm64/IOLbox.app/Contents/MacOS/IOLbox"
          echo "--- archive hash ---"
          sha256sum "$GITHUB_WORKSPACE/iolbox-macos-arm64.tar.gz"

      # GPL compliance. The archive redistributes Debian's qemu-user,
      # binfmt-support and the amd64 runtime libraries, so iolbox owes their
      # corresponding source. GPLv2 §3 and GPLv3 §6 both allow discharging
      # that by ACCOMPANYING the binaries with source, which is the option
      # taken here: the source ships as a release asset from the same page as
      # the binary, rather than relying on a pointer to a third party's
      # archive. See packaging/macos/guest-assets/SOURCE-OFFER.txt.
      #
      # Versions come from sources.lock, which was derived from Debian's
      # OpenPGP-signed index — NOT from listing a pool directory, which
      # returns many versions at once and silently produces source that does
      # not correspond to the shipped binary.
      - name: Assemble corresponding source for redistributed packages
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/guest-assets/fetch-corresponding-source.sh \
            --out "$RUNNER_TEMP/iolbox-macos-arm64-corresponding-source" \
            --archive "$GITHUB_WORKSPACE/iolbox-macos-arm64-corresponding-source.tar.gz"
          sha256sum "$GITHUB_WORKSPACE/iolbox-macos-arm64-corresponding-source.tar.gz" \
            > "$GITHUB_WORKSPACE/iolbox-macos-arm64-corresponding-source.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: iolbox-macos
          path: |
            iolbox-macos-arm64.tar.gz
            iolbox-macos-arm64.tar.gz.sha256

      # Separate artifact: this is ~200 MB of source tarballs and must not be
      # bundled into the archive users download to run iolbox. It is published
      # alongside it.
      - uses: actions/upload-artifact@v4
        with:
          name: iolbox-macos-corresponding-source
          path: |
            iolbox-macos-arm64-corresponding-source.tar.gz
            iolbox-macos-arm64-corresponding-source.tar.gz.sha256

  # ---------------------------------------------------------------------
  # Release: only on an actual tag push (workflow_dispatch runs stop after
  # producing/testing artifacts — no draft is created). Published as a
  # DRAFT, never live, because three artifacts CI cannot build (vmdk/vmx,
  # OVA, qcow2 — all need loop devices/chroot/grub on a root-capable
  # builder) plus the Windows launcher's qemu+disk bundle must be attached
  # by hand before this is fit to publish.
  # ---------------------------------------------------------------------
  release:
    name: Draft GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # NOTE: this is a literal block scalar — every line is a glob, and a
          # '#' line would be treated as a (non-matching) pattern, not a
          # comment. Keep commentary out here.
          #
          # iolbox-macos-corresponding-source carries the GPL corresponding
          # source for the Debian packages the macOS archive redistributes. It
          # MUST be published alongside the archive; dropping it while still
          # shipping iolbox-macos breaks compliance.
          files: |
            iolbox-windows/**/*
            iolbox-linux/**/*
            iolbox-macos/**/*
            iolbox-macos-corresponding-source/**/*
          body: |
            iolbox ${{ github.ref_name }}

            **Contains no Cisco software.** Supply your own IOL/IOU images
            and hold the appropriate licenses for them.

            ---

            **THIS DRAFT IS INCOMPLETE.** CI only builds what it can build
            without loop devices/chroot/grub or a real QEMU disk. Before
            publishing, attach the following — built by hand on the private
            root-capable builder — to this draft:

            - `iolbox-appliance-${{ github.ref_name }}.vmdk` + `.vmx` (VMware Workstation/Player drop-in appliance)
            - `iolbox-appliance-${{ github.ref_name }}.ova` (ESXi / VirtualBox / generic OVF import)
            - `iolbox-disk-${{ github.ref_name }}.qcow2` + the Windows launcher bundle zip (qemu/ + iolbox-launcher.exe + iolbox-disk.qcow2)

            Everything else — `iolbox-rootfs.tar` (WSL2), `iolbox-ct-${{ github.ref_name }}.tar.zst` (Proxmox LXC), `iolbox-server-${{ github.ref_name }}.tar.gz` (native systemd), `iolbox-launcher.exe`, `capture-helper.exe`, `SHA256SUMS-ci.txt` — is already attached by this workflow.

            **Apple Silicon macOS (Lima):** the Mac archive requires user-installed Lima and ships **two** Linux payloads; the launcher selects one from the profile it resolves.

            - **native-arm64** runs the supervisor, VPCS, and tool packs as **real arm64 binaries** on a Debian 13/trixie guest with the pinned 6.12.101+deb13-cloud-arm64 kernel. x86_64 IOL is still translated, by **qemu-user inside the guest** (redistributed in the archive and installed offline at provisioning time — see `notices/REDISTRIBUTED-PACKAGES.md`), not by Rosetta.
            - **Rosetta profiles** — `debian13` (default guest) and `jammy` (compatibility, pinned to the qualified 5.15 line) — are unchanged and run the existing amd64 payload under Rosetta.
            - On a qualifying Apple Silicon host with **no existing iolbox install**, `auto` now prefers **native-arm64**. An **existing** install keeps its current profile and Lima machine; migrate deliberately with `--profile native-arm64`. To stay on Rosetta explicitly, set `IOLBOX_PROFILE=rosetta-amd64`. `auto` falls back to Rosetta whenever the native preflight fails; a forced `--profile native-arm64` fails closed instead.
            - **x86_64 IOL only, on both profiles.** i386/i86bi remain unsupported, and arm64-native IOL remains unsupported.
            - native-arm64 has **no host qualification row**, so the launcher reports it as `UNMEASURED — CANARY REQUIRED`. It is gated at runtime by its own fail-closed canary, not by a prior qualification result.

            The archive also ships `IOLbox.app`, an optional unsigned convenience launcher — double-click it instead of running `./iolbox start` from a terminal. It opens a real Terminal window running that same command (every prompt, including the first-run vCPU/RAM choice, is still there), then drops into a small `iolbox>` prompt once start finishes: type `stop` to shut the VM down, or `status`/`diagnose` to check on it. Closing the window without typing `stop` leaves the VM running. On a **browser download**, run `xattr -dr com.apple.quarantine` on the whole extracted folder **before** the first double-click — skipping that step gets the app deleted by Gatekeeper (“is damaged, move to Trash”), not just warned about.

            The archive is unsigned: verify its outer and internal SHA-256 files, inspect quarantine, and if the launcher is quarantined remove that attribute from the launcher only with `xattr -d com.apple.quarantine ./iolbox` before `./iolbox start`. GUI, console, and capture forwards are loopback-only and unauthenticated. No Cisco software is included.

            See [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md) for which artifact matches your situation, and un-draft only once the manually-built artifacts above are attached.
          generate_release_notes: true
