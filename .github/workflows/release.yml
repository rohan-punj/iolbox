name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app + helpers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build capture-helper.exe
        working-directory: tools/capture-helper
        run: |
          go build -o ../../app/src-tauri/binaries/capture-helper.exe .

      - name: Cross-build supervisor (linux/amd64) for bundling into the runtime
        working-directory: supervisor
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o ../app/src-tauri/binaries/supervisor-linux-amd64 ./cmd/supervisor

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build Tauri bundle (msi + nsis)
        working-directory: app
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: iolab-windows
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe

  # The runtime rootfs/appliance is baked on Linux and attached to the release.
  build-runtime:
    name: Bake runtime (WSL tar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build supervisor for the runtime
        working-directory: supervisor
        env: { GOOS: linux, GOARCH: amd64 }
        run: go build -o bin/supervisor-linux-amd64 ./cmd/supervisor
      - name: Bake rootfs + WSL tar
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap
          sudo runtime/build-rootfs.sh
          sudo runtime/pack-wsl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iolab-runtime
          path: runtime/build/iolab-rootfs.tar

  release:
    needs: [build-windows, build-runtime]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iolab-windows/**/*
            iolab-runtime/**/*
          body: |
            iolab ${{ github.ref_name }}

            **Contains no Cisco software.** Supply your own IOL/IOU images.
            Download the Windows installer and, on first run, pick a runtime
            provider (VMware / WSL2). See README for details.
          generate_release_notes: true
