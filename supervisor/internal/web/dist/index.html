<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iolbox</title>
    <script>
      // Set the persisted theme before first paint to avoid a flash of the
      // wrong surface. themeStore reconciles this on boot.
      (function () {
        try {
          var t = localStorage.getItem("iolbox.theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "glass" ? "glass" : "bench"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "bench");
        }
      })();
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-BN6iZyrv.css">

  </body>
</html>
